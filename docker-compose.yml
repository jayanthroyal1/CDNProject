services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  
  
  redis:
   image: redis:7
   container_name: redis
   restart: unless-stopped
   ports:
     - "6379:6379"
  
  backend:
    build:
      context: ./Backend
    container_name: Backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
     - Backend/.env
    depends_on:
      - mongodb
      - redis

volumes:
  mongodb_data: