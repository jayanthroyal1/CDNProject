openapi: 3.0.0

info:
  title: Portfolio API
  description: Portfolio Backend APIs
  version: 1.0.0

servers:
  - url: http://localhost:5000

paths:

  /api/v1/auth/login:

    post:
      summary: Login User

      tags:
        - Authentication

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                email:
                  type: string

                password:
                  type: string

      responses:
        "200":
          description: Login Success